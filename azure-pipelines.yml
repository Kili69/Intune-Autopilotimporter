trigger:
  branches:
    include:
      - '*'

pr:
  branches:
    include:
      - '*'

variables:
  - group: autopilot-import-deployment

pool:
  vmImage: windows-latest

stages:
  - stage: Test
    jobs:
      - job: Pester
        steps:
          - checkout: self
            fetchDepth: 0
          - task: PowerShell@2
            displayName: Require change history and version update
            inputs:
              pwsh: true
              targetType: inline
              script: |
                $headCommit = if ([string]::IsNullOrWhiteSpace(
                    $env:SYSTEM_PULLREQUEST_SOURCECOMMITID)) {
                  (git rev-parse HEAD).Trim()
                }
                else {
                  $env:SYSTEM_PULLREQUEST_SOURCECOMMITID
                }
                ./src/Scripts/Test-ChangeHistory.ps1 `
                  -BaseCommit "$headCommit^" `
                  -HeadCommit $headCommit
          - pwsh: |
              $changedFiles = @(git diff `
                --name-only `
                HEAD^ `
                HEAD `
                -- src/Web)
              $changed = ($changedFiles.Count -gt 0).ToString().ToLowerInvariant()
              Write-Host "##vso[task.setvariable variable=webFrontendChanged]$changed"
            displayName: Detect web frontend changes
          - task: NodeTool@0
            displayName: Use Node.js 22
            condition: eq(variables['webFrontendChanged'], 'true')
            inputs:
              versionSpec: '22.x'
          - script: |
              npm ci
              npm run check
            workingDirectory: src/Web
            displayName: Test and build web frontend
            condition: eq(variables['webFrontendChanged'], 'true')
          - task: PowerShell@2
            displayName: Run Pester tests
            inputs:
              pwsh: true
              targetType: inline
              script: |
                if (-not (Get-Module -ListAvailable -Name Pester | Where-Object Version -eq '5.7.1')) {
                  Install-Module Pester -Scope CurrentUser -RequiredVersion 5.7.1 -Force -SkipPublisherCheck
                }
                Import-Module Pester -RequiredVersion 5.7.1 -Force
                Invoke-Pester ./src/Tests/AutopilotImport.Tests.ps1 -CI
          - task: PowerShell@2
            displayName: Build deployment package
            env:
              SOURCE_BRANCH: $(Build.SourceBranch)
            inputs:
              pwsh: true
              targetType: inline
              script: |
                $branchName = $env:SOURCE_BRANCH `
                  -replace '^refs/heads/', '' `
                  -replace '^refs/pull/', 'pr-'
                $package = ./src/Scripts/New-DeploymentPackage.ps1 `
                  -BranchName $branchName
                Write-Host "##vso[task.setvariable variable=deploymentPackagePath]$($package.FullName)"
                Write-Host "##vso[task.setvariable variable=deploymentPackageName]$($package.BaseName)"
          - task: PublishPipelineArtifact@1
            displayName: Publish deployment package
            inputs:
              targetPath: $(deploymentPackagePath)
              artifact: $(deploymentPackageName)

  - stage: Deploy
    dependsOn: Test
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - deployment: DeployFunction
        environment: autopilot-import
        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self
                - task: AzurePowerShell@5
                  displayName: Deploy infrastructure and Function code
                  env:
                    TAG_AUTHORIZATION_RULES_JSON: $(tagAuthorizationRulesJson)
                    TAG_MANAGER_PRINCIPAL_IDS_JSON: $(tagManagerPrincipalIdsJson)
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    ScriptType: InlineScript
                    Inline: |
                      $tagAuthorizationRules = @(
                        $env:TAG_AUTHORIZATION_RULES_JSON | ConvertFrom-Json
                      )
                      if ($tagAuthorizationRules.Count -eq 0) {
                        throw 'tagAuthorizationRulesJson must contain at least one rule.'
                      }

                      $tagManagerPrincipalIds = @()
                      if (-not [string]::IsNullOrWhiteSpace($env:TAG_MANAGER_PRINCIPAL_IDS_JSON)) {
                        $tagManagerPrincipalIds = @(
                          $env:TAG_MANAGER_PRINCIPAL_IDS_JSON | ConvertFrom-Json
                        )
                      }

                      ./src/Installer/Install-AutopilotImport.ps1 `
                        -SubscriptionId '$(subscriptionId)' `
                        -TenantId '$(tenantId)' `
                        -ResourceGroupName '$(resourceGroupName)' `
                        -Location '$(location)' `
                        -FunctionAppName '$(functionAppName)' `
                        -EntraClientId '$(entraClientId)' `
                        -WebClientId '$(webClientId)' `
                        -InstallerPrincipalId '$(installerPrincipalId)' `
                        -TagAuthorizationRule $tagAuthorizationRules `
                        -TagManagerPrincipalId $tagManagerPrincipalIds `
                        -SkipEntraAppConfiguration `
                        -SkipGraphPermission `
                        -Confirm:$false
                    azurePowerShellVersion: LatestVersion
                    pwsh: true
                - task: PublishPipelineArtifact@1
                  displayName: Publish client settings
                  inputs:
                    targetPath: client.settings.json
                    artifact: autopilot-import-client-settings