name: Main promotion policy

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-source:
    name: Validate dev promotion
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Require dev as source branch
        shell: pwsh
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          if ($env:SOURCE_BRANCH -ne 'dev') {
            Write-Error 'Pull requests to main must originate from dev.'
            exit 1
          fi

          Write-Output 'Promotion from dev to main is allowed.'