name: Increment project version

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: project-version-main
  cancel-in-progress: false

jobs:
  increment-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Count pushed commits
        id: commits
        shell: pwsh
        run: |
          $before = '${{ github.event.before }}'
          $after = '${{ github.sha }}'
          $versionExisted = $false
          if ($before -notmatch '^0+$') {
            git cat-file -e "$($before):VERSION" 2>$null
            $versionExisted = $LASTEXITCODE -eq 0
          }
          if (-not $versionExisted) {
            $count = 0
          }
          else {
            $count = [int] (git rev-list --count "$before..$after")
            if ($count -lt 1) {
              $count = 1
            }
          }
          "count=$count" >> $env:GITHUB_OUTPUT

      - name: Update version entries
        id: version
        if: steps.commits.outputs.count != '0'
        shell: pwsh
        run: |
          git pull --rebase origin main
          $version = ./scripts/Update-ProjectVersion.ps1 `
            -IncrementBy ${{ steps.commits.outputs.count }}
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Commit version increment
        if: steps.commits.outputs.count != '0'
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git commit -m "Bump project version to ${{ steps.version.outputs.version }} [skip ci]"
          git push origin main
