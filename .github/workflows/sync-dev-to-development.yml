name: Sync dev to development branches

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-dev-to-development
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          persist-credentials: false
      - name: Open dev synchronization pull requests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          ./src/Scripts/Sync-DevelopmentBranches.ps1 -Repository $env:REPOSITORY
