name: Sync dev to nextversion

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-dev-to-nextversion
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Prepare sync branch without downgrading nextversion
        id: sync
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-Git {
            param([Parameter(ValueFromRemainingArguments)][string[]] $Arguments)
            & git @Arguments
            if ($LASTEXITCODE -ne 0) { throw "git $($Arguments -join ' ') failed. Resolve conflicts on sync/dev-to-nextversion and rerun." }
          }
          git ls-remote --exit-code --heads origin nextversion
          if ($LASTEXITCODE -eq 2) {
            Write-Host '::notice::nextversion has not been created yet; no sync is needed.'
            return
          }
          if ($LASTEXITCODE -ne 0) { throw 'Cannot query nextversion.' }
          Invoke-Git config user.name 'github-actions[bot]'
          Invoke-Git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $targetVersion = [version] ((git show origin/nextversion:VERSION) -join '').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read nextversion VERSION.' }
          git merge-base --is-ancestor origin/dev origin/nextversion
          if ($LASTEXITCODE -eq 0) { return }
          if ($LASTEXITCODE -ne 1) { throw 'Cannot compare dev and nextversion ancestry.' }
          $devVersion = [version] ((git show origin/dev:VERSION) -join '').Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read dev VERSION.' }
          if ([version]"$($targetVersion.Major).$($targetVersion.Minor)" -le
              [version]"$($devVersion.Major).$($devVersion.Minor)") {
            throw 'Start the next release cycle on nextversion with a new minor/major before syncing dev.'
          }
          git ls-remote --exit-code --heads origin sync/dev-to-nextversion
          if ($LASTEXITCODE -eq 0) {
            Invoke-Git switch -c sync/dev-to-nextversion origin/sync/dev-to-nextversion
            Invoke-Git merge --no-edit origin/dev
          }
          elseif ($LASTEXITCODE -eq 2) {
            Invoke-Git switch -c sync/dev-to-nextversion origin/dev
          }
          else { throw 'Cannot query the sync branch.' }
          # The sync branch belongs to the future release, never to dev.
          $syncVersion = [version] (Get-Content VERSION -Raw).Trim()
          $versionBase = if ($syncVersion -gt $targetVersion) { $syncVersion } else { $targetVersion }
          if ($versionBase.Major -ne $targetVersion.Major -or $versionBase.Minor -ne $targetVersion.Minor) {
            throw 'The existing sync branch has a different future release line; finish or remove its old PR before starting a new cycle.'
          }
          Set-Content VERSION $versionBase.ToString()
          $newVersion = ./src/Scripts/Update-ProjectVersion.ps1
          $date = [datetime]::ParseExact(($newVersion -split '\.')[2], 'yyyyMMdd', $null).ToString('yyyy-MM-dd')
          foreach ($file in @('History.md', 'CHANGELOG.md')) {
            $content = Get-Content $file -Raw
            $heading = if ($file -eq 'History.md') { "## ``$newVersion`` - $date" } else { "## [$newVersion] - $date" }
            $pattern = "(?m)^## [^\r\n]+ - $date\r?$"
            $matches = [regex]::Matches($content, $pattern)
            if ($matches.Count -gt 1) { throw "Consolidate duplicate date sections in $file first." }
            if ($matches.Count -eq 1) {
              $content = [regex]::Replace($content, $pattern, $heading)
            }
            else {
              $index = $content.IndexOf("`n## ")
              if ($index -lt 0) { throw "Cannot find release sections in $file." }
              $content = $content.Insert($index, "`n$heading`n`n- Synchronized dev changes while preserving the nextversion release line.`n")
            }
            Set-Content $file $content -NoNewline
          }
          "prepared=true" >> $env:GITHUB_OUTPUT

      - name: Build versioned frontend
        if: steps.sync.outputs.prepared == 'true'
        working-directory: src/Web
        run: |
          npm ci
          npm run build

      - name: Publish or update sync PR
        if: steps.sync.outputs.prepared == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          git add --all
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m 'chore: sync dev into nextversion [skip ci]'
            if ($LASTEXITCODE -ne 0) { throw 'Cannot commit prepared sync.' }
          }
          elseif ($LASTEXITCODE -ne 0) { throw 'Cannot inspect prepared sync.' }
          git push origin HEAD:sync/dev-to-nextversion
          if ($LASTEXITCODE -ne 0) { throw 'Cannot push sync branch.' }
          $prs = gh pr list --base nextversion --head sync/dev-to-nextversion --json number | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot query sync PRs.' }
          if (@($prs).Count -eq 0) {
            gh pr create --base nextversion --head sync/dev-to-nextversion `
              --title 'Sync dev changes into nextversion (preserve release line)' `
              --body 'Includes the latest dev ancestry. Major/minor remain those of nextversion; only date/counter advance. Resolve any content conflicts on this sync branch, never on dev. Merge only after the branch/version policy passes.'
            if ($LASTEXITCODE -ne 0) { throw 'Cannot create sync PR. Enable GitHub Actions pull-request creation in repository settings.' }
          }
