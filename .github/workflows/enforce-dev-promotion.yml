name: Enforce dev promotion

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited

permissions:
  contents: read

jobs:
  enforce-dev-source:
    name: Require dev as source branch
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request source
        shell: bash
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.base_ref }}
        run: |
          if [[ "$TARGET_BRANCH" == "main" && ( "$SOURCE_REPOSITORY" != "$TARGET_REPOSITORY" || "$SOURCE_BRANCH" != "dev" ) ]]; then
            echo "::error::Pull requests to main must originate from the dev branch in $TARGET_REPOSITORY."
            exit 1
          fi

  branch-version-policy:
    name: Branch and version policy
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted policy from protected dev
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch PR objects without checking out source code
        env:
          PR_NUMBER: ${{ github.event.number }}
        run: |
          git fetch origin "pull/$PR_NUMBER/head:refs/remotes/policy/head"
          if ! git fetch origin "pull/$PR_NUMBER/merge:refs/remotes/policy/merge"; then
            echo "::error::No prospective merge is available. Resolve merge conflicts and update the PR."
            exit 1
          fi
          git fetch origin dev:refs/remotes/policy/dev

      - name: Validate branch route and merged version
        shell: pwsh
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          TARGET_BRANCH: ${{ github.base_ref }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
          BASE_COMMIT: ${{ github.event.pull_request.base.sha }}
          HEAD_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          $mergeParents = (git show -s --format=%P refs/remotes/policy/merge) -split ' '
          if ($LASTEXITCODE -ne 0 -or $mergeParents.Count -ne 2 -or
              $mergeParents[0] -ne $env:BASE_COMMIT -or
              $mergeParents[1] -ne $env:HEAD_COMMIT) {
            throw 'The merge preview is stale. Rerun after GitHub refreshes it.'
          }
          ./src/Scripts/Test-BranchPromotion.ps1 `
            -SourceBranch $env:SOURCE_BRANCH -TargetBranch $env:TARGET_BRANCH `
            -SourceRepository $env:SOURCE_REPOSITORY -TargetRepository $env:TARGET_REPOSITORY `
            -BaseCommit $env:BASE_COMMIT -HeadCommit $env:HEAD_COMMIT `
            -DevCommit refs/remotes/policy/dev -ResultCommit refs/remotes/policy/merge
