name: Main branch source policy

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-source-branch:
    name: Require dev as source branch
    runs-on: ubuntu-latest
    steps:
      - name: Validate source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" != "dev" ]]; then
            echo "Pull requests to main must originate from dev."
            exit 1
          fi