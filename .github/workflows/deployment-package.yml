name: Build deployment package

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Pester
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name Pester | Where-Object Version -ge '5.0.0')) {
            Install-Module Pester -Scope CurrentUser -MinimumVersion 5.0.0 -Force -SkipPublisherCheck
          }

      - name: Run tests
        shell: pwsh
        run: Invoke-Pester ./src/Tests/AutopilotImport.Tests.ps1 -CI

      - name: Build web frontend
        working-directory: src/Web
        shell: pwsh
        run: |
          npm ci
          npm run build

      - name: Build deployment package
        id: package
        shell: pwsh
        env:
          PACKAGE_BRANCH: ${{ github.ref_name }}
        run: |
          $package = ./src/Scripts/New-DeploymentPackage.ps1 `
            -BranchName $env:PACKAGE_BRANCH
          "path=$($package.FullName)" >> $env:GITHUB_OUTPUT
          "name=$($package.BaseName)" >> $env:GITHUB_OUTPUT

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error
          retention-days: 30